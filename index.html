<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#f6f5f1" />
  <title>Маяк — история</title>
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main id="app" class="app">
    <section id="intro" class="screen intro active" aria-label="Вступление">
      <div class="intro-copy">
        <p id="line1" class="intro-line">для полного погружения<br>включите звук</p>
        <p id="line2" class="intro-line intro-line--secondary">для начала тапните на экран</p>
      </div>
      <button id="start" class="tap-zone" aria-label="Начать"></button>
      <div class="intro-mark">М</div>
    </section>

    <section id="stories" class="screen stories" aria-label="История">
      <div class="story-progress" id="storyProgress"></div>
      <div class="story-counter" id="storyCounter">01 / 03</div>
      <div id="storyTrack" class="story-track"></div>
      <div class="story-hint">свайп →</div>
    </section>

    <section id="gallery" class="screen gallery" aria-label="Галерея">
      <header class="gallery-head">
        <div>
          <span class="eyebrow">после истории</span>
          <h1>архив</h1>
        </div>
        <span id="galleryCount">15 фото</span>
      </header>
      <div id="galleryGrid" class="gallery-grid"></div>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
